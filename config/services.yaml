# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # The deployed prod checkout has no .git directory (the server does a
    # plain export, not a clone - see deploy.yml/CLAUDE.md), so this can't
    # be read from git at runtime. Bump this by hand in the same commit as
    # each future release tag.
    app.version: '1.19.0'

    # A console command (e.g. the streak-reminder cron job) has no request
    # context to generate an absolute URL from - this is the one place that
    # needs to know the public base URL by hand.
    app.base_url: 'https://guitorial.com'

    # Sender identity for automated mail (streak reminders etc.) - not a
    # real mailbox, just the From header; MAILER_DSN itself is an env var,
    # not a parameter, since it differs per environment (see .env.local on
    # the server / CLAUDE.md).
    app.mailer_from_address: 'noreply@guitorial.com'
    app.mailer_from_name: 'Guitorial'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
