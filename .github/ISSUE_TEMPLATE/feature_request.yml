name: Feature request
description: Suggest an idea, a new tool, or an improvement for Guitorial
title: "[Feature] "
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: What does this relate to?
      options:
        - Tonart erkennen (key recognition)
        - Kapo-Trainer (capo trainer)
        - Funktion bestimmen (harmonic function)
        - Griffbrett (fretboard)
        - Skalen-Generator (scale generator)
        - Übungstagebuch (practice diary)
        - Verlauf (history)
        - Richtig üben (practice guide)
        - A new tool/idea
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your request related to a problem?
      description: What's currently missing or annoying? (skip if not applicable)
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered (optional)
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
    validations:
      required: false
