name: Deploy

# Push-to-deploy against the bare repo `guitorial.git` on the LAMP server.
# The server's post-receive hook decides what happens per ref:
#   refs/heads/main -> staging checkout + composer/migrate/cache
#   refs/tags/*     -> production release (tags only, never plain commits)
on:
  push:
    branches: [main]
    tags: ['v*']

env:
  DEPLOY_REMOTE: ssh://xlifep@www516.your-server.de:222/~/guitorial.git

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -p 222 www516.your-server.de >> ~/.ssh/known_hosts

      - name: Push main to server (triggers staging deploy)
        run: git push "$DEPLOY_REMOTE" HEAD:refs/heads/main

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -p 222 www516.your-server.de >> ~/.ssh/known_hosts

      - name: Push tag to server (triggers production release)
        run: git push "$DEPLOY_REMOTE" "refs/tags/${{ github.ref_name }}"
