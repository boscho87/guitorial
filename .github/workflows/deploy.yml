name: Deploy

# Push-to-deploy against the bare repo `guitorial.git` on the LAMP server.
# The server's post-receive hook decides what happens per ref:
#   refs/heads/next -> staging checkout + composer/migrate/cache
#   refs/tags/*     -> production release (tags only, never plain commits
#                      or a plain push to main)
on:
  push:
    branches: [next]
    tags: ['v*']

env:
  DEPLOY_REMOTE: ssh://xlifep@www516.your-server.de:222/~/guitorial.git

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not just the latest commit - otherwise the push
          # below has no common ancestor with the server's next and git
          # rejects it as a non-fast-forward.
          fetch-depth: 0

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -p 222 www516.your-server.de >> ~/.ssh/known_hosts

      - name: Push next to server (triggers staging deploy)
        run: git push "$DEPLOY_REMOTE" HEAD:refs/heads/next

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -p 222 www516.your-server.de >> ~/.ssh/known_hosts

      - name: Push tag to server (triggers production release)
        run: git push "$DEPLOY_REMOTE" "refs/tags/${{ github.ref_name }}"
