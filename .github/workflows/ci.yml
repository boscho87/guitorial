name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # --no-scripts: the tests are pure PHP domain logic and never touch the
      # database, so skip Symfony's post-install hooks (cache:clear etc.) -
      # they'd otherwise try to reach a DATABASE_URL host that doesn't
      # exist in CI.
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - run: vendor/bin/phpunit
