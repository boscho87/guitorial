legal:
  privacy:
    title: Datenschutzerklärung
    meta_description: "Wie Guitorial mit Cookies und Nutzungsdaten umgeht."
    controller:
      title: "Verantwortliche Stelle"
      body: |
        Simon Müller
        Oftringen, Schweiz
        E-Mail: simon.d.mueller@itscoding.ch
    cookies:
      title: Cookies
      body: "Guitorial verwendet technisch notwendige Cookies: ein Session-Cookie (PHPSESSID, wird beim Schliessen des Browsers gelöscht), ein anonymes Wiedererkennungs-Cookie (guitorial_visitor, ein Jahr gültig, HttpOnly, SameSite=Lax) und – nur wenn du dich anmeldest – ein Login-Cookie zum Angemeldetbleiben (bis zu 90 Tage). Über das Wiedererkennungs-Cookie wird dein Übungsverlauf und Übetagebuch diesem Gerät/Browser zugeordnet."
    account:
      title: "Optionales Konto (Google/Microsoft-Anmeldung)"
      body: "Die Anmeldung ist freiwillig und für die Nutzung von Guitorial nicht erforderlich – ohne Anmeldung funktioniert die App unverändert vollständig. Meldest du dich mit Google oder Microsoft an, fragen wir ausschliesslich deine E-Mail-Adresse und deinen Namen (Vor- und Nachname) ab, wie vom jeweiligen Anbieter über die Berechtigungen \"E-Mail-Adresse\" und \"Profil\" übermittelt – keine weiteren Daten, keine Kontakte, keine Dateien, kein Kalender. Zweck ist ausschliesslich, dein Konto wiederzuerkennen und deinen Übungsfortschritt geräteübergreifend verfügbar zu machen. Guitorial erhält dabei kein Passwort und keinen darüberhinausgehenden Zugriff auf dein Google-/Microsoft-Konto, und diese Daten werden nicht verkauft, nicht zu Werbezwecken genutzt und nicht an Dritte weitergegeben. Die erste Anmeldung auf einem Gerät übernimmt automatisch den bisherigen anonymen Fortschritt dieses Geräts; bei weiteren Geräten bleiben dort bereits vorhandene anonyme Daten getrennt vom Konto. Den Zugriff von Guitorial auf dein Google-Konto kannst du jederzeit selbst und unabhängig von uns unter myaccount.google.com/permissions widerrufen; die zugehörigen Daten bei uns kannst du wie unten unter \"Deine Rechte\" beschrieben löschen lassen."
    data:
      title: "Welche Daten werden gespeichert?"
      body: "Gespeichert werden ausschliesslich Übungsdaten (welches Tool, wann, wie viele Fragen richtig) und die Einträge deines Übetagebuchs – jeweils verknüpft mit der zufälligen Cookie-ID bzw., bei Anmeldung, mit deinem Konto. Diese Daten dienen ausschliesslich der Anzeige deines eigenen Verlaufs und werden nicht an Dritte weitergegeben oder verkauft."
    fonts:
      title: "Google Fonts"
      body: "Diese Seite lädt Schriftarten von den Servern von Google (fonts.googleapis.com, fonts.gstatic.com). Dabei kann Google die IP-Adresse des aufrufenden Geräts verarbeiten. Weitere Informationen findest du in der Datenschutzerklärung von Google."
    no_tracking:
      title: "Keine Analyse- oder Tracking-Tools"
      body: "Guitorial setzt keine Analyse-, Marketing- oder Tracking-Dienste ein und zeigt keine Werbung."
    rights:
      title: "Deine Rechte"
      body: |
        Ohne Anmeldung kann eine einzelne Person anhand der gespeicherten Daten nicht zuverlässig identifiziert werden. Mit einem Konto sind E-Mail-Adresse, Vor- und Nachname mit deinen Daten verknüpft. In beiden Fällen kannst du Einsicht oder Löschung anfragen, indem du dich per E-Mail meldest (siehe oben) – bei einem Konto am einfachsten mit der E-Mail-Adresse, mit der du angemeldet bist, sonst mit einem Hinweis auf Gerät/Browser und ungefährem Nutzungszeitraum.
