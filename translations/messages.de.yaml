      body: "Diese Seite lädt Schriftarten von den Servern von Google (fonts.googleapis.com, fonts.gstatic.com). Dabei kann Google die IP-Adresse des aufrufenden Geräts verarbeiten. Weitere Informationen findest du in der Datenschutzerklärung von Google."
