practice_guide:
  title: "Richtig üben"
  meta_description: "Tipps für effektives Musiktheorie- und Gitarrenüben: Struktur statt Zufall, Balance zwischen Theorie und Praxis, und wie du dranbleibst."
  structure:
    title: "Struktur schlägt Zufall"
    body: "Fang mit ein paar Minuten Aufwärmen an, um die Finger locker zu machen. Übe danach gezielt das, was bisher oft schiefging – die Tools gewichten automatisch stärker, was du bereits falsch beantwortet hast. Erst danach kommt Neues dazu: ein Akkord, ein Konzept, ein Stück. Am Ende darf es auch einfach Spass machen: frei spielen."
  balance:
    title: "Theorie und Praxis brauchen sich gegenseitig"
    body: "Die fünf Übungs-Tools trainieren dein Musiktheorie-Verständnis – Tonarten, Funktionen, das Griffbrett. Fortschritt am Instrument entsteht aber erst, wenn du das auch wirklich spielst. Das Tagebuch trennt deshalb bewusst zwischen „Theorie“ und „Praxis“, damit beides sichtbar bleibt und keins der beiden untergeht."
  consistency:
    title: "Kurz und regelmässig statt lang und selten"
    body: "10 bis 15 fokussierte Minuten am Tag bringen mehr als eine lange Session einmal pro Woche. Im Verlauf siehst du deine aktuelle Serie – ein einfacher Anreiz, dranzubleiben, statt alles auf einmal nachzuholen."
  cta:
    title: "Leg los"
    diary: "Zum Tagebuch"
    tools: "Zu den Tools"

