practice_guide:
  title: "Richtig üben"
  meta_title: "Gitarre richtig üben"
  meta_description: "Konkrete Tipps für den Übe-Alltag bei Guitorial: Routine aufbauen, Rhythmus, Griffbrett, Gehör, schwierige Stellen üben und dranbleiben."
  intro: "Die fünf Tools trainieren dein Musiktheorie-Verständnis – Tonarten, Funktionen, das Griffbrett. Wirklich besser wirst du aber erst, wenn du das auch am Instrument spielst. Deshalb bleiben Theorie und Praxis unter Meine Übungen bewusst sichtbar nebeneinander, statt dass eins von beiden untergeht."
  problem_label: Problem
  duration_label: Dauer
  more_topics: "Weitere Themen anzeigen"
  as_exercise_cta: "Als eigene Übung erfassen"
  topics:
    routine:
      title: "Übungsroutine aufbauen"
      problem: "Du übst mal viel, mal gar nicht – ohne klaren roten Faden."
      explanation: "Eine kurze, feste Reihenfolge sorgt dafür, dass Aufwärmen, Schwachstellen und Neues nicht dem Zufall überlassen bleiben."
      exercise: "Leg eine feste Reihenfolge fest: 2 Minuten aufwärmen, dann gezielt üben, was zuletzt oft schiefging (die Tools gewichten das automatisch stärker), danach etwas Neues – ein Akkord, ein Konzept, ein Stück – und zum Schluss frei spielen."
      duration: "10–15 Min."
      tool_label: "Zu den Routinen"
    rhythm:
      title: "Rhythmus und Timing"
      problem: "Ein Akkordwechsel klappt einzeln, aber im Takt bricht alles zusammen."
      explanation: "Timing ist eine eigene Fertigkeit, die sich getrennt vom reinen Greifen trainieren lässt."
      exercise: "Stell ein Metronom auf ein Tempo, bei dem du dich sicher fühlst, und übe einen Akkordwechsel oder ein Riff ausschliesslich im Takt – lieber langsam und exakt als schnell und wackelig. Steigere das Tempo erst, wenn es sauber sitzt."
      duration: "5–10 Min."
    fretboard:
      title: "Griffbrett verstehen"
      problem: "Ausserhalb der ersten paar Lagen weisst du nicht mehr, welcher Ton wo liegt."
      explanation: "Das Griffbrett wird erst dann wirklich vertraut, wenn du Töne auch in höheren Lagen sofort findest, nicht nur die üblichen Startpositionen."
      exercise: "Wähle eine Saite und suche gezielt einen bestimmten Ton in mehreren Lagen, bevor du zur nächsten Saite wechselst."
      duration: "5–10 Min."
      tool_label: "Zum Griffbrett-Trainer"
    ear:
      title: "Gehör entwickeln"
      problem: "Du hörst einen Akkordwechsel, kannst ihn aber nicht benennen."
      explanation: "Tonarten und Funktionen schneller zu erkennen setzt regelmässiges, gezieltes Training voraus – reines Zuhören reicht dafür meist nicht."
      exercise: "Übe kurze Runden mit einem der Theorie-Tools, statt zu versuchen, alles auf einmal beim freien Spielen mitzuhören."
      duration: "5–10 Min."
      tool_label: "Tonart erkennen üben"
    hard_spots:
      title: "Schwierige Stellen üben"
      problem: "Ein Stück klappt fast durchgehend – aber an derselben Stelle reisst es immer wieder ab."
      explanation: "Eine schwierige Stelle isoliert und langsam zu üben bringt mehr als das ganze Stück von vorne zu wiederholen."
      exercise: "Grenze die schwierige Stelle auf wenige Takte ein, übe sie deutlich langsamer im Kreis, und binde sie erst danach wieder in den Kontext davor und danach ein."
      duration: "5–10 Min."
    motivation:
      title: "Motivation und Dranbleiben"
      problem: "Nach ein paar Tagen ohne Übung fällt es schwer, wieder anzufangen."
      explanation: "Kurze, regelmässige Einheiten bringen mehr als eine lange Sitzung einmal pro Woche – und sichtbarer Fortschritt hält den Antrieb aufrecht."
      exercise: "Leg dir eine minimale tägliche Grösse fest, die du fast immer schaffst, und schau danach kurz im Fortschritt vorbei, wie sich deine Serie entwickelt."
      duration: "5–10 Min."
      tool_label: "Fortschritt ansehen"
  cta:
    title: "Leg los"
    diary: "Meine Übungen öffnen"
    tools: "Zu den Tools"

