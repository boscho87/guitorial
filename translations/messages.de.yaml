key_recognition:
  title: Tonart erkennen
  description: "Eine Akkordfolge lesen und die passende Tonart bestimmen."
  settings:
    intro: "Du liest eine kurze Akkordfolge und bestimmst die passende Tonart. Dur und die parallele Moll-Tonart klingen in den Akkorden gleich (z.B. C-Dur/A-Moll) und zählen daher als eine Antwort. Wähle unten aus, welche Tonarten in dieser Runde vorkommen sollen."
    presets_label: "Schnellauswahl nach Wichtigkeit"
    preset_common: "Häufig (C, G, D, A, E)"
    preset_extended: "Erweitert (+ F, Bb, Eb)"
    preset_all: Alle
    keys_label: "Tonarten"
    question_count_label: "Anzahl Fragen"
    continue: Weiter
  practice:
    question_progress: "Frage %current% von %total%"
    prompt: "Welche Tonart passt zu dieser Akkordfolge?"
  summary:
    title: "Runde beendet"
    result: "%correct% von %total% richtig"
    time: "in %time% Min."
    restart: "Neue Runde"
    change_settings: "Einstellungen ändern"

harmonic_function:
  title: Funktion bestimmen
  description: "Erkennen, welche Stufe ein Akkord oder Ton in einer Tonart ist."
  settings:
    intro: "Du siehst eine Tonart und einen Akkord oder Ton daraus (z.B. F#m in D-Dur) und bestimmst, welche Stufe das ist (hier: vi). Im Gegensatz zu \"Tonart erkennen\" zählen Dur und Moll hier als unterschiedliche Antworten, da dieselbe Note in Dur und Moll eine andere Stufe sein kann."
    presets_label: "Schnellauswahl nach Wichtigkeit"
    preset_common: "Häufig (C, G, D, A, E + Moll-Parallelen)"
    preset_extended: "Erweitert (+ F, Bb, Eb + Moll-Parallelen)"
    preset_all: Alle
    customize_keys: "Tonarten einzeln anpassen"
    major_group: "Dur-Tonarten"
    minor_group: "Moll-Tonarten"
    mode_label: "Was wird abgefragt?"
    mode_hint: "Mehrfachauswahl möglich – bei beiden wechselt es zufällig pro Frage."
    mode_chord: Akkorde
    mode_note: "Tonleiter-Töne"
    question_count_label: "Anzahl Fragen"
    continue: Weiter
  practice:
    question_progress: "Frage %current% von %total%"
    key_context: "Tonart: %key%"
    prompt: "Welche Stufe ist das?"
  summary:
    title: "Runde beendet"
    result: "%correct% von %total% richtig"
    time: "in %time% Min."
    restart: "Neue Runde"
    change_settings: "Einstellungen ändern"

capo_trainer:
  title: Kapo-Trainer
  description: "Griffbild, Kapo-Bund und klingenden Akkord ineinander umrechnen."
  settings:
    intro: "Du rechnest Griffbild, Kapo-Bund und klingenden Akkord ineinander um (z.B. \"Kapo im 2. Bund, gegriffen G – welcher Akkord klingt wirklich?\"). Wähle unten die Shapes und die Frage-Richtung(en)."
    shapes_label: "Shapes"
    mode_label: "Frage-Richtung"
    mode_hint: "Mehrfachauswahl möglich – bei mehreren wechselt die Richtung zufällig pro Frage."
    mode_1: "Griffbild + Kapo → klingender Akkord"
    mode_2: "Zielakkord + Kapo → Griffbild"
    mode_3: "Griffbild + Zielakkord → Kapo-Bund"
    max_fret_label: "Kapo-Bereich bis Bund"
    question_count_label: "Anzahl Fragen"
    continue: Weiter
  practice:
    question_progress: "Frage %current% von %total%"
    mode_1_hint: "Kapo im %fret%. Bund, gegriffen wird %shape%."
    mode_1_prompt: "Welcher Akkord klingt wirklich?"
    mode_2_hint: "Kapo im %fret%. Bund, du willst %sounding% hören."
    mode_2_prompt: "Welches Griffbild spielst du?"
    mode_3_hint: "Du greifst %shape%, willst aber %sounding% hören."
    mode_3_prompt: "Auf welchen Bund kommt der Kapo?"
  summary:
    title: "Runde beendet"
    result: "%correct% von %total% richtig"
    time: "in %time% Min."
    restart: "Neue Runde"
    change_settings: "Einstellungen ändern"

fretboard:
  title: Griffbrett
  description: "Töne, Saiten und Bünde auf dem Griffbrett auswendig lernen."
  settings:
    intro: "Du bestimmst, wie ein Ton, eine Saite und ein Bund zusammenhängen – z.B. \"Welcher Ton ist auf der A-Saite im 5. Bund?\". Saite 1 (e) und Saite 6 (E) klingen bei gleichem Bund identisch und zählen bei \"Welche Saite?\" beide als richtig."
    strings_label: "Saiten"
    mode_label: "Was wird abgefragt?"
    mode_hint: "Mehrfachauswahl möglich – bei mehreren wechselt die Richtung zufällig pro Frage."
    mode_note: "Saite + Bund → Ton"
    mode_string: "Ton + Bund → Saite"
    mode_fret: "Saite + Ton → Bund"
    max_fret_label: "Bis Bund"
    question_count_label: "Anzahl Fragen"
    continue: Weiter
  practice:
    question_progress: "Frage %current% von %total%"
    mode_note_hint: "Saite %string%, Bund %fret%."
    mode_note_prompt: "Welcher Ton ist das?"
    mode_string_hint: "Bund %fret%, Ton %note%."
    mode_string_prompt: "Welche Saite ist das?"
    mode_fret_hint: "Saite %string%, Ton %note%."
    mode_fret_prompt: "Welcher Bund ist das?"
  summary:
    title: "Runde beendet"
    result: "%correct% von %total% richtig"
    time: "in %time% Min."
    restart: "Neue Runde"
    change_settings: "Einstellungen ändern"

scale_generator:
  title: "Skalen-Generator"
  description: "Zufälliger Ton zum Üben – zum Improvisieren, Auswendiglernen oder für Fingersätze."
  settings:
    intro: "Wähle, welche Töne vorkommen sollen. Der Generator zieht danach zufällig einen Ton – ohne Wiederholung, bis alle einmal dran waren. Optional wechselt er nach einer festen Zeit von selbst weiter."
    tones_label: Töne
    auto_advance_label: "Automatisch weiter nach"
    auto_advance_hint: "Sekunden (0 = manuell)"
    continue: "Los geht's"
  practice:
    prompt: "Dein nächster Ton"
    progress: "%current% von %total%"
    next: Weiter
    auto_advance_hint: "Wechselt automatisch nach %seconds% Sek."
  summary:
