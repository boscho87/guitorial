key_recognition:
  title: Tonart erkennen
  meta_title: "Tonart erkennen – Gitarre üben"
  description: "Eine Akkordfolge lesen und die passende Tonart bestimmen."
  settings:
    intro: "Du liest eine kurze Akkordfolge und bestimmst die passende Tonart. Dur und die parallele Moll-Tonart klingen in den Akkorden gleich (z.B. C-Dur/A-Moll) und zählen daher als eine Antwort. Wähle unten aus, welche Tonarten in dieser Runde vorkommen sollen."
    presets_label: "Schnellauswahl nach Wichtigkeit"
    preset_common: "Häufig (C, G, D, A, E)"
    preset_extended: "Erweitert (+ F, Bb, Eb)"
    preset_all: Alle
    keys_label: "Tonarten"
    question_count_label: "Anzahl Fragen"
    continue: Weiter
  practice:
    question_progress: "Frage %current% von %total%"
    prompt: "Welche Tonart passt zu dieser Akkordfolge?"
  summary:
    title: "Runde beendet"
    result: "%correct% von %total% richtig"
    time: "in %time% Min."
    restart: "Neue Runde"
    change_settings: "Einstellungen ändern"

harmonic_function:
  title: Funktion bestimmen
  meta_title: "Funktion bestimmen – Gitarre üben"
  description: "Erkennen, welche Stufe ein Akkord oder Ton in einer Tonart ist."
  settings:
    intro: "Du siehst eine Tonart und einen Akkord oder Ton daraus (z.B. F#m in D-Dur) und bestimmst, welche Stufe das ist (hier: vi). Im Gegensatz zu \"Tonart erkennen\" zählen Dur und Moll hier als unterschiedliche Antworten, da dieselbe Note in Dur und Moll eine andere Stufe sein kann."
    presets_label: "Schnellauswahl nach Wichtigkeit"
    preset_common: "Häufig (C, G, D, A, E + Moll-Parallelen)"
    preset_extended: "Erweitert (+ F, Bb, Eb + Moll-Parallelen)"
    preset_all: Alle
    customize_keys: "Tonarten einzeln anpassen"
    major_group: "Dur-Tonarten"
    minor_group: "Moll-Tonarten"
    mode_label: "Was wird abgefragt?"
    mode_hint: "Mehrfachauswahl möglich – bei beiden wechselt es zufällig pro Frage."
    mode_chord: Akkorde
    mode_note: "Tonleiter-Töne"
    question_count_label: "Anzahl Fragen"
    continue: Weiter
  practice:
    question_progress: "Frage %current% von %total%"
    key_context: "Tonart: %key%"
    prompt: "Welche Stufe ist das?"
  summary:
    title: "Runde beendet"
    result: "%correct% von %total% richtig"
    time: "in %time% Min."
    restart: "Neue Runde"
    change_settings: "Einstellungen ändern"

capo_trainer:
