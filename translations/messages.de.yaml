      body: "Guitorial verwendet zwei technisch notwendige Cookies: ein Session-Cookie (PHPSESSID, wird beim Schliessen des Browsers gelöscht) und ein anonymes Wiedererkennungs-Cookie (guitorial_visitor, ein Jahr gültig, HttpOnly, SameSite=Lax). Über das zweite Cookie wird dein Übungsverlauf und Übungstagebuch diesem Gerät/Browser zugeordnet – ohne Registrierung, ohne Namen, ohne E-Mail-Adresse."
    data:
      title: "Welche Daten werden gespeichert?"
      body: "Gespeichert werden ausschliesslich Übungsdaten (welches Tool, wann, wie viele Fragen richtig) und die Einträge deines Übungstagebuchs – jeweils verknüpft mit der zufälligen Cookie-ID, nie mit einer echten Identität. Diese Daten dienen ausschliesslich der Anzeige deines eigenen Verlaufs und werden nicht an Dritte weitergegeben oder verkauft."
