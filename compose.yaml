services:
  guitorial-webserver:
    container_name: guitorial-webserver
    image: 'nginx:alpine'
    working_dir: /application
    volumes:
      - '.:/application'
      - './_docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf'
    ports:
      - '8080:80'

  guitorial-php-fpm:
    environment:
      PHP_CS_FIXER_IGNORE_ENV: true
      DATABASE_URL: 'mysql://guitorial:guitorial@guitorial-db:3306/guitorial?serverVersion=8.0&charset=utf8mb4'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      dockerfile: ./_docker/php-fpm/Dockerfile
      target: dev
      args:
        - "USER_ID=${UID:-1000}"
    container_name: guitorial-php-fpm
    working_dir: /application
    volumes:
      - '.:/application'
      - './_docker/php-fpm/php-ini-overrides.ini:/etc/php/8.3/fpm/conf.d/99-overrides.ini'
      - './_docker/php-fpm/xdebug.ini:/etc/php/8.3/mods-available/xdebug.ini'

  guitorial-db:
    container_name: guitorial-db
    ports:
      - 9080:3306
    image: 'mysql:8.0'
    volumes:
      - mysql-data-guitorial:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: guitorial
      MYSQL_DATABASE: guitorial
      MYSQL_USER: guitorial
      MYSQL_PASSWORD: guitorial

volumes:
  mysql-data-guitorial:
    driver: local
